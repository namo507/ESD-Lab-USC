[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esd-lab-usc"
version = "0.1.0"
description = "NANO Study research pipelines and dashboard runtime for the ESD Lab."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3,<5",
    "click>=8.1.0,<9",
    "joblib>=1.3.0,<2",
    "numpy>=1.26.0,<2",
    "pandas>=2.1.0,<3",
    "pyarrow>=15.0.0,<22",
    "pypdf>=4.2.0,<7",
    "psutil>=5.9.0,<8",
    "python-dotenv>=1.0.0,<2",
    "PyYAML>=6.0.1,<7",
    "requests>=2.31.0,<3",
    "scipy>=1.11.0,<2",
    "tqdm>=4.66.0,<5",
]

[project.optional-dependencies]
assistant = [
    "beautifulsoup4>=4.12.3,<5",
    "numpy>=1.26.0,<2",
    "openai>=1.55.0,<3",
    "pandas>=2.1.0,<3",
    "pyarrow>=15.0.0,<22",
    "pypdf>=4.2.0,<7",
    "psutil>=5.9.0,<8",
    "python-dotenv>=1.0.0,<2",
    "PyYAML>=6.0.1,<7",
    "requests>=2.31.0,<3",
]
dashboard = [
    "beautifulsoup4>=4.12.3,<5",
    "numpy>=1.26.0,<2",
    "openai>=1.55.0,<3",
    "pandas>=2.1.0,<3",
    "pyarrow>=15.0.0,<22",
    "pypdf>=4.2.0,<7",
    "psutil>=5.9.0,<8",
    "python-dotenv>=1.0.0,<2",
    "PyYAML>=6.0.1,<7",
    "requests>=2.31.0,<3",
]
dev = [
    "black>=23.12.0,<27",
    "flake8>=6.1.0,<8",
    "isort>=5.13.0,<6",
    "mypy>=1.7.0,<2",
    "pre-commit>=3.6.0,<5",
    "pytest>=7.4.0,<9",
    "pytest-cov>=4.1.0,<8",
    "pytest-timeout>=2.3.1,<3",
    "responses>=0.24.0,<0.27",
]
ml = [
    "scikit-learn>=1.4.0,<2",
    "torch>=2.1.0,<2.6",
    "torchvision>=0.16.0,<0.21",
    "xgboost>=2.0.0,<3",
]
notebooks = [
    "ipykernel>=6.27.0,<7",
    "jupyter>=1.0.0,<2",
    "nbformat>=5.9.0,<6",
]
r = [
    "rpy2>=3.5.14,<3.7",
]
signals = [
    "biosppy>=2.2.1,<2.3",
    "neurokit2>=0.2.7,<0.3",
]
viz = [
    "jinja2>=3.1.0,<4",
    "markdown>=3.5.0,<4",
    "matplotlib>=3.8.0,<4",
    "seaborn>=0.13.0,<0.14",
]

[tool.setuptools.packages.find]
include = ["dashboard*", "k8s*", "redcap*", "src*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false
pretty = true

[tool.pytest.ini_options]
pythonpath = ["."]
