replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  # Bounded by the single-node memory budget, not by ambition: three dashboard
  # replicas at 3Gi already sits beside a 7Gi model server on a 15.1 GB host.
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: esd-lab-dashboard
  tag: "0.14.2"
  pullPolicy: IfNotPresent

existingClaims:
  readings: ""
  data: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

dashboard:
  serverIntervalSeconds: 0
  fallbackSynthetic: true
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "8"
      memory: 3Gi

assistant:
  enabled: true
  # The in-cluster Ollama deployment is the primary tier now. The hosted NVIDIA
  # tier below is retained and disabled: rolling back is a values edit.
  ollamaEnabled: true
  # Primary provider. Remaining tiers are tried in order when this one is
  # unconfigured or failing, so one provider outage cannot take ESD Buddy down.
  provider: gemini
  # Blank keeps the default order (primary first, then remaining tiers).
  # Set to pin one, e.g. "gemini,nvidia".
  fallbackChain: ""
  geminiApiBase: https://generativelanguage.googleapis.com/v1beta/openai
  geminiModel: gemini-3.5-flash
  geminiApiKeySecretKey: dashboardAssistantGeminiApiKey
  # A cluster has no Docker Model Runner on its host, so the local tier stays
  # off unless an OpenAI-compatible in-cluster service is pointed at here.
  localEnabled: true
  localRuntime: ollama
  # Resolved into the release name by the templates.
  localApiBase: http://esd-lab-dashboard-ollama:11434/v1
  # Pinned by scripts/resolve_local_models.py; see models/MANIFEST.json.
  localModel: qwen2.5:14b
  runtime: nvidia-build-api
  apiBase: https://integrate.api.nvidia.com/v1
  apiKeySecretKey: dashboardAssistantApiKey
  model: nvidia/nemotron-3-super-120b-a12b
  enableThinking: false
  reasoningBudget: 0
  maxNewTokens: 16384
  temperature: 0.2
  topP: 0.95
  stream: true
  requestTimeoutSeconds: 180
  maxRetries: 6
  retryBaseSeconds: 2
  retryMaxSeconds: 30
  retryJitter: 0.25
  maxConcurrency: 2
  circuitFailureThreshold: 3
  circuitRecoverySeconds: 60
  queueTimeoutSeconds: 180
  contextBudget: 12000
  selfHostedEnabled: false
  selfHostedBaseUrl: http://nemotron-nim:8000/v1

watcher:
  enabled: true
  pollSeconds: 2
  heartbeatPath: /app/dashboard/data/readings_watcher_heartbeat.json
  heartbeatMaxAgeSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

reconcile:
  enabled: true
  schedule: "*/15 * * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

worker:
  maxRetries: 3
  retryBaseSeconds: 1
  retryMaxSeconds: 30
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

pipeline:
  environment: kubernetes
  debounceSeconds: 5
  leaseTtlSeconds: 900
  k8sApiTimeoutSeconds: 2.5
  clusterVisualizationEnabled: true
  assistantClusterContextEnabled: true

secret:
  create: false
  name: esd-lab-dashboard-secrets
  redcapApiUrl: ""
  redcapApiToken: ""
  participantIdSalt: ""
  dashboardOperatorToken: ""
  pagesDeployHookUrl: ""
  dashboardAssistantApiKey: ""
  dashboardAssistantGeminiApiKey: ""

# ─── Local model server ──────────────────────────────────────────────────────
ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: "0.13.0"
    pullPolicy: IfNotPresent
  keepAlive: 24h
  numParallel: 2
  # Two: the generalist plus the embedding model. At 1 the embedder evicts the
  # generalist on every retrieval-backed answer and each request pays a full
  # reload. See the deployment template.
  maxLoadedModels: 2
  persistence:
    # Weights survive a pod restart only with a real claim. Without one a
    # restart re-pulls ~9 GB.
    existingClaim: ""
  podDisruptionBudget:
    enabled: true
  resources:
    requests:
      cpu: "4"
      memory: 4Gi
    limits:
      cpu: "12"
      memory: 7Gi
      nvidia.com/gpu: 1

# ─── Retrieval index builder ─────────────────────────────────────────────────
indexer:
  enabled: true
  threads: 6
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "6"
      memory: 2Gi

# ─── Study landscape refresh ─────────────────────────────────────────────────
scrape:
  enabled: true
  schedule: "0 3 * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

# ─── Full index rebuild ──────────────────────────────────────────────────────
reindex:
  enabled: true
  schedule: "0 4 * * 0"
  backoffLimit: 1
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "6"
      memory: 2Gi

networkPolicy:
  enabled: true
  # Default deny, then an explicit allow-list. Only these hosts are reachable
  # from the cluster; everything else is dropped. Slack is absent on purpose --
  # it is opt-in and off by default.
  egressAllowlist:
    - clinicaltrials.gov
    - eutils.ncbi.nlm.nih.gov
    - api.reporter.nih.gov
    - www.esdlabsc.com
    - redcap.research.sc.edu

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
