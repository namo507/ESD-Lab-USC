replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: esd-lab-dashboard
  tag: "0.14.2"
  pullPolicy: IfNotPresent

existingClaims:
  readings: ""
  data: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

dashboard:
  serverIntervalSeconds: 0
  fallbackSynthetic: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

assistant:
  enabled: true
  # Primary provider. Remaining tiers are tried in order when this one is
  # unconfigured or failing, so one provider outage cannot take ESD Buddy down.
  provider: gemini
  # Blank keeps the default order (primary first, then remaining tiers).
  # Set to pin one, e.g. "gemini,nvidia".
  fallbackChain: ""
  geminiApiBase: https://generativelanguage.googleapis.com/v1beta/openai
  geminiModel: gemini-3.5-flash
  geminiApiKeySecretKey: dashboardAssistantGeminiApiKey
  # A cluster has no Docker Model Runner on its host, so the local tier stays
  # off unless an OpenAI-compatible in-cluster service is pointed at here.
  localEnabled: false
  localApiBase: http://model-runner.default.svc.cluster.local:12434/engines/v1
  localModel: ai/nemotron-3-nano
  runtime: nvidia-build-api
  apiBase: https://integrate.api.nvidia.com/v1
  apiKeySecretKey: dashboardAssistantApiKey
  model: nvidia/nemotron-3-super-120b-a12b
  enableThinking: false
  reasoningBudget: 0
  maxNewTokens: 16384
  temperature: 0.2
  topP: 0.95
  stream: true
  requestTimeoutSeconds: 180
  maxRetries: 6
  retryBaseSeconds: 2
  retryMaxSeconds: 30
  retryJitter: 0.25
  maxConcurrency: 2
  circuitFailureThreshold: 3
  circuitRecoverySeconds: 60
  queueTimeoutSeconds: 180
  contextBudget: 12000
  selfHostedEnabled: false
  selfHostedBaseUrl: http://nemotron-nim:8000/v1

watcher:
  enabled: true
  pollSeconds: 2
  heartbeatPath: /app/dashboard/data/readings_watcher_heartbeat.json
  heartbeatMaxAgeSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

reconcile:
  enabled: true
  schedule: "*/15 * * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

worker:
  maxRetries: 3
  retryBaseSeconds: 1
  retryMaxSeconds: 30
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

pipeline:
  environment: kubernetes
  debounceSeconds: 5
  leaseTtlSeconds: 900
  k8sApiTimeoutSeconds: 2.5
  clusterVisualizationEnabled: true
  assistantClusterContextEnabled: true

secret:
  create: false
  name: esd-lab-dashboard-secrets
  redcapApiUrl: ""
  redcapApiToken: ""
  participantIdSalt: ""
  dashboardOperatorToken: ""
  pagesDeployHookUrl: ""
  dashboardAssistantApiKey: ""
  dashboardAssistantGeminiApiKey: ""

networkPolicy:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
