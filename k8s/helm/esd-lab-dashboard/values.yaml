replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: esd-lab-dashboard
  tag: "0.14.2"
  pullPolicy: IfNotPresent

existingClaims:
  readings: ""
  data: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

dashboard:
  serverIntervalSeconds: 0
  fallbackSynthetic: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

assistant:
  enabled: true
  provider: ollama
  runtime: ollama
  # Defaults to the in-cluster Ollama service below. Point this at an external
  # Ollama endpoint (and set ollama.enabled=false) to share one GPU-backed host.
  apiBase: ""
  # Ollama needs no credential; the key is only read when a proxy fronts it.
  apiKeySecretKey: dashboardAssistantApiKey
  model: llama3.2:3b
  enableThinking: false
  reasoningBudget: 0
  maxNewTokens: 768
  temperature: 0.2
  topP: 0.9
  stream: true
  requestTimeoutSeconds: 120
  maxRetries: 2
  retryBaseSeconds: 0.5
  retryMaxSeconds: 4
  retryJitter: 0.25
  maxConcurrency: 2
  circuitFailureThreshold: 3
  circuitRecoverySeconds: 30
  queueTimeoutSeconds: 120
  contextBudget: 7000
  contextWindow: 8192

# In-cluster Ollama runtime (https://github.com/ollama/ollama). The model is
# pulled into a PersistentVolume on first start, so image builds stay small and
# no weights are ever committed to the repository.
ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: 0.32.5
    pullPolicy: IfNotPresent
  service:
    port: 11434
  keepAlive: 30m
  # Keep >= assistant.contextWindow or packed grounding is truncated.
  contextLength: 8192
  numParallel: 2
  maxLoadedModels: 1
  # Cold loads on small nodes can exceed Ollama's 5m default.
  loadTimeout: 15m
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  nodeSelector: {}
  tolerations: []

watcher:
  enabled: true
  pollSeconds: 2
  heartbeatPath: /app/dashboard/data/readings_watcher_heartbeat.json
  heartbeatMaxAgeSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

reconcile:
  enabled: true
  schedule: "*/15 * * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

worker:
  maxRetries: 3
  retryBaseSeconds: 1
  retryMaxSeconds: 30
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

pipeline:
  environment: kubernetes
  debounceSeconds: 5
  leaseTtlSeconds: 900
  k8sApiTimeoutSeconds: 2.5
  clusterVisualizationEnabled: true
  assistantClusterContextEnabled: true

secret:
  create: false
  name: esd-lab-dashboard-secrets
  redcapApiUrl: ""
  redcapApiToken: ""
  participantIdSalt: ""
  dashboardOperatorToken: ""
  pagesDeployHookUrl: ""
  dashboardAssistantApiKey: ""

networkPolicy:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
