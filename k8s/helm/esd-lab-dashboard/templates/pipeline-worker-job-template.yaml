apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}-worker-job-template
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: readings-pipeline-worker
data:
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      generateName: esd-readings-pipeline-
      labels:
        app.kubernetes.io/name: {{ include "esd-lab-dashboard.name" . }}
        app.kubernetes.io/component: readings-pipeline-worker
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: {{ .Values.worker.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "esd-lab-dashboard.name" . }}
            app.kubernetes.io/component: readings-pipeline-worker
        spec:
          serviceAccountName: {{ include "esd-lab-dashboard.serviceAccountName" . }}
          restartPolicy: Never
          securityContext:
{{ toYaml .Values.podSecurityContext | indent 12 }}
          containers:
            - name: worker
              image: {{ include "esd-lab-dashboard.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
{{ toYaml .Values.securityContext | indent 16 }}
              command: ["python", "-m", "k8s.pipeline.worker"]
              envFrom:
                - configMapRef:
                    name: {{ include "esd-lab-dashboard.fullname" . }}-config
              env:
                - name: K8S_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
{{ toYaml .Values.worker.resources | indent 16 }}
              volumeMounts:
                - name: readings
                  mountPath: "/app/esd-lab-readings"
                - name: dashboard-data
                  mountPath: "/app/dashboard/data"
          volumes:
            - name: readings
              persistentVolumeClaim:
                claimName: {{ include "esd-lab-dashboard.requiredReadingsClaim" . | quote }}
            - name: dashboard-data
              persistentVolumeClaim:
                claimName: {{ include "esd-lab-dashboard.requiredDataClaim" . | quote }}
