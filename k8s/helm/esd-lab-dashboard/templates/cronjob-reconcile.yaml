{{- if .Values.reconcile.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}-readings-reconcile
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: readings-reconcile
spec:
  schedule: {{ .Values.reconcile.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.reconcile.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.reconcile.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.reconcile.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "esd-lab-dashboard.labels" . | nindent 12 }}
            app.kubernetes.io/component: readings-reconcile
        spec:
          serviceAccountName: {{ include "esd-lab-dashboard.serviceAccountName" . }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: reconcile
              image: {{ include "esd-lab-dashboard.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              command:
                - python
                - -m
                - k8s.pipeline.watcher
                - --once
                - --trigger-source
                - scheduled-reconcile
              envFrom:
                - configMapRef:
                    name: {{ include "esd-lab-dashboard.fullname" . }}-config
              env:
                - name: K8S_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: REDCAP_API_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: redcapApiUrl
                      optional: true
                - name: REDCAP_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: redcapApiToken
                      optional: true
                - name: PARTICIPANT_ID_SALT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: participantIdSalt
                      optional: true
                - name: PAGES_DEPLOY_HOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: pagesDeployHookUrl
                      optional: true
              resources:
                {{- toYaml .Values.watcher.resources | nindent 16 }}
              volumeMounts:
                - name: readings
                  mountPath: "/app/esd-lab-readings"
                - name: dashboard-data
                  mountPath: "/app/dashboard/data"
          volumes:
            - name: readings
              persistentVolumeClaim:
                claimName: {{ include "esd-lab-dashboard.requiredReadingsClaim" . | quote }}
            - name: dashboard-data
              persistentVolumeClaim:
                claimName: {{ include "esd-lab-dashboard.requiredDataClaim" . | quote }}
{{- end }}
