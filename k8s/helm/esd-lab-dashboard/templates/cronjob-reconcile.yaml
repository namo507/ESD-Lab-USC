{{- if .Values.reconcile.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}-readings-reconcile
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: readings-reconcile
spec:
  schedule: {{ .Values.reconcile.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.reconcile.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.reconcile.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "esd-lab-dashboard.labels" . | nindent 12 }}
            app.kubernetes.io/component: readings-reconcile
        spec:
          serviceAccountName: {{ include "esd-lab-dashboard.serviceAccountName" . }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: reconcile
              image: {{ include "esd-lab-dashboard.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              command:
                - python
                - -m
                - dashboard.k8s_pipeline.watcher
                - --once
                - --trigger-source
                - scheduled-reconcile
              envFrom:
                - configMapRef:
                    name: {{ include "esd-lab-dashboard.fullname" . }}-config
              env:
                - name: K8S_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                {{- toYaml .Values.watcher.resources | nindent 16 }}
              volumeMounts:
                - name: readings
                  mountPath: "/app/ESD Lab readings"
                - name: dashboard-data
                  mountPath: "/app/dashboard/data"
          volumes:
            - name: readings
              persistentVolumeClaim:
                claimName: {{ .Values.existingClaims.readings | default "REQUIRED_READINGS_PVC" | quote }}
            - name: dashboard-data
              persistentVolumeClaim:
                claimName: {{ .Values.existingClaims.data | default "REQUIRED_DATA_PVC" | quote }}
{{- end }}
