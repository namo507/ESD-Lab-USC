apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "esd-lab-dashboard.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "esd-lab-dashboard.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "esd-lab-dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "esd-lab-dashboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - python
            - dashboard/server/live_dashboard_server.py
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --interval
            - {{ .Values.dashboard.serverIntervalSeconds | quote }}
            {{- if .Values.dashboard.fallbackSynthetic }}
            - --fallback-synthetic
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "esd-lab-dashboard.fullname" . }}-config
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REDCAP_API_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: redcapApiUrl
                  optional: true
            - name: REDCAP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: redcapApiToken
                  optional: true
            - name: PARTICIPANT_ID_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: participantIdSalt
                  optional: true
            - name: DASHBOARD_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: dashboardOperatorToken
                  optional: true
            - name: PAGES_DEPLOY_HOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: pagesDeployHookUrl
                  optional: true
            # Ollama itself needs no credential; this stays optional so an
            # authenticating proxy in front of a shared runtime still works.
            - name: DASHBOARD_ASSISTANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.assistant.apiKeySecretKey }}
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: readings
              mountPath: "/app/esd-lab-readings"
            - name: dashboard-data
              mountPath: "/app/dashboard/data"
      volumes:
        - name: readings
          persistentVolumeClaim:
            claimName: {{ include "esd-lab-dashboard.requiredReadingsClaim" . | quote }}
        - name: dashboard-data
          persistentVolumeClaim:
            claimName: {{ include "esd-lab-dashboard.requiredDataClaim" . | quote }}
