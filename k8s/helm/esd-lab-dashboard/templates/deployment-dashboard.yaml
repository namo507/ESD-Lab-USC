apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "esd-lab-dashboard.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "esd-lab-dashboard.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "esd-lab-dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.assistant.enabled .Values.assistant.autoDownload }}
      initContainers:
        - name: assistant-model-bootstrap
          image: {{ include "esd-lab-dashboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - python
            - scripts/prepare_dashboard_assistant.py
            - --tier
            - {{ .Values.assistant.tier | quote }}
            - --download
          envFrom:
            - configMapRef:
                name: {{ include "esd-lab-dashboard.fullname" . }}-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: hfToken
                  optional: true
          volumeMounts:
            - name: assistant-model-cache
              mountPath: "/app/models/local_llms"
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "esd-lab-dashboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - python
            - dashboard/server/live_dashboard_server.py
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --interval
            - {{ .Values.dashboard.serverIntervalSeconds | quote }}
            {{- if .Values.dashboard.fallbackSynthetic }}
            - --fallback-synthetic
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "esd-lab-dashboard.fullname" . }}-config
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REDCAP_API_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: redcapApiUrl
                  optional: true
            - name: REDCAP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: redcapApiToken
                  optional: true
            - name: PARTICIPANT_ID_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: participantIdSalt
                  optional: true
            - name: DASHBOARD_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: dashboardOperatorToken
                  optional: true
            - name: PAGES_DEPLOY_HOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: pagesDeployHookUrl
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: hfToken
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: readings
              mountPath: "/app/esd-lab-readings"
            - name: dashboard-data
              mountPath: "/app/dashboard/data"
            {{- if .Values.assistant.enabled }}
            - name: assistant-model-cache
              mountPath: "/app/models/local_llms"
            {{- end }}
      volumes:
        - name: readings
          persistentVolumeClaim:
            claimName: {{ include "esd-lab-dashboard.requiredReadingsClaim" . | quote }}
        - name: dashboard-data
          persistentVolumeClaim:
            claimName: {{ include "esd-lab-dashboard.requiredDataClaim" . | quote }}
        {{- if .Values.assistant.enabled }}
        - name: assistant-model-cache
          {{- if .Values.assistant.modelCacheClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.assistant.modelCacheClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
