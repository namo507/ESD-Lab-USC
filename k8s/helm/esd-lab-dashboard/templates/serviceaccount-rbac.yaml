{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "esd-lab-dashboard.serviceAccountName" . }}
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "esd-lab-dashboard.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "esd-lab-dashboard.fullname" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}-node-reader
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}-node-reader
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "esd-lab-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "esd-lab-dashboard.fullname" . }}-node-reader
