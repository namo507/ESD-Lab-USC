{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  redcapApiUrl: {{ .Values.secret.redcapApiUrl | quote }}
  redcapApiToken: {{ .Values.secret.redcapApiToken | quote }}
  redcapAbcSurveysToken: {{ .Values.secret.redcapAbcSurveysToken | quote }}
  redcapIpsaSurveysToken: {{ .Values.secret.redcapIpsaSurveysToken | quote }}
  redcapActionToken: {{ .Values.secret.redcapActionToken | quote }}
  redcapIpsaLabToken: {{ .Values.secret.redcapIpsaLabToken | quote }}
  redcapAbcLabToken: {{ .Values.secret.redcapAbcLabToken | quote }}
  redcapNicoToken: {{ .Values.secret.redcapNicoToken | quote }}
  redcapNanoSurveysToken: {{ .Values.secret.redcapNanoSurveysToken | quote }}
  redcapNanoLabToken: {{ .Values.secret.redcapNanoLabToken | quote }}
  participantIdSalt: {{ .Values.secret.participantIdSalt | quote }}
  dashboardOperatorToken: {{ .Values.secret.dashboardOperatorToken | quote }}
  pagesDeployHookUrl: {{ .Values.secret.pagesDeployHookUrl | quote }}
  dashboardAssistantApiKey: {{ .Values.secret.dashboardAssistantApiKey | quote }}
  dashboardAssistantLocalApiKey: {{ .Values.secret.dashboardAssistantLocalApiKey | quote }}
{{- end }}
