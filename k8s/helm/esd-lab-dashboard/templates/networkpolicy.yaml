{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}-baseline
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "esd-lab-dashboard.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  {{- if .Values.ollama.enabled }}
        # Dashboard pods reach the assistant runtime on its own port.
        - protocol: TCP
          port: {{ .Values.ollama.service.port }}
  {{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - podSelector: {}
{{- end }}
