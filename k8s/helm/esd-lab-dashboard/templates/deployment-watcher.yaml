{{- if .Values.watcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "esd-lab-dashboard.fullname" . }}-watcher
  labels:
    {{- include "esd-lab-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: readings-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "esd-lab-dashboard.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: readings-watcher
  template:
    metadata:
      labels:
        {{- include "esd-lab-dashboard.labels" . | nindent 8 }}
        app.kubernetes.io/component: readings-watcher
    spec:
      serviceAccountName: {{ include "esd-lab-dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: watcher
          image: {{ include "esd-lab-dashboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - python
            - -m
            - k8s.pipeline.watcher
          envFrom:
            - configMapRef:
                name: {{ include "esd-lab-dashboard.fullname" . }}-config
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.watcher.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - python
                - -c
                - |
                  from pathlib import Path
                  assert Path('/app/esd-lab-readings').is_dir()
                  assert Path('/app/dashboard/data').is_dir()
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import time
                  from pathlib import Path
                  assert Path('/app/esd-lab-readings').is_dir()
                  assert Path('/app/dashboard/data').is_dir()
                  heartbeat = Path(os.environ['READINGS_WATCHER_HEARTBEAT_PATH'])
                  assert heartbeat.is_file()
                  assert time.time() - heartbeat.stat().st_mtime <= float(os.environ['READINGS_WATCHER_HEARTBEAT_MAX_AGE_SECONDS'])
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import time
                  from pathlib import Path
                  heartbeat = Path(os.environ['READINGS_WATCHER_HEARTBEAT_PATH'])
                  assert heartbeat.is_file()
                  assert time.time() - heartbeat.stat().st_mtime <= float(os.environ['READINGS_WATCHER_HEARTBEAT_MAX_AGE_SECONDS'])
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: readings
              mountPath: "/app/esd-lab-readings"
            - name: dashboard-data
              mountPath: "/app/dashboard/data"
      volumes:
        - name: readings
          persistentVolumeClaim:
            claimName: {{ include "esd-lab-dashboard.requiredReadingsClaim" . | quote }}
        - name: dashboard-data
          persistentVolumeClaim:
            claimName: {{ include "esd-lab-dashboard.requiredDataClaim" . | quote }}
{{- end }}
