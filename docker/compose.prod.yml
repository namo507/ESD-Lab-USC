services:
  dashboard:
    init: true
    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile
    image: esd-lab-dashboard:local
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8080}:8080"
    environment:
      <<: *dashboard-assistant-environment
      PYTHONUNBUFFERED: "1"
    models:
      esd-buddy:
        endpoint_var: DASHBOARD_ASSISTANT_LOCAL_API_BASE
        model_var: DASHBOARD_ASSISTANT_LOCAL_MODEL
    cpus: "2.0"
    mem_limit: ${DASHBOARD_MEM_LIMIT:-2g}
    pids_limit: 512
    volumes:
      - type: bind
        source: ../dashboard/data
        target: /app/dashboard/data
      - type: bind
        source: ../esd-lab-readings
        target: /app/esd-lab-readings
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/healthz'))
          assert payload.get('status') == 'ok'
          assert payload.get('dashboard')
          assert payload.get('readings')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      com.esdlabusc.autoheal: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - dashboard-net

  dashboard-share:
    profiles: ["share", "share-quick"]
    image: cloudflare/cloudflared:2026.5.2
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2}
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    command: tunnel --metrics 0.0.0.0:2000 --no-autoupdate --url http://dashboard:8080
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      com.esdlabusc.autoheal: "true"
    restart: unless-stopped
    networks:
      - dashboard-net

  dashboard-share-named:
    profiles: ["share-named"]
    image: cloudflare/cloudflared:2026.5.2
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2}
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    command: tunnel --metrics 0.0.0.0:2000 --no-autoupdate run --token-file /run/secrets/cloudflare-tunnel-token
    secrets:
      - source: cloudflare-tunnel-token
        target: cloudflare-tunnel-token
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      com.esdlabusc.autoheal: "true"
    restart: unless-stopped
    networks:
      - dashboard-net

  # Continuous self-heal sidecar — restarts any container labelled
  # `autoheal=true` whose healthcheck reports "unhealthy" (a hung-but-alive
  # process that `restart: unless-stopped` would never recover).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    init: true
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: com.esdlabusc.autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "60"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    cpus: "0.25"
    mem_limit: 64m
    pids_limit: 64
    networks:
      - dashboard-net

networks:
  dashboard-net:
    driver: bridge

secrets:
  cloudflare-tunnel-token:
    environment: CLOUDFLARE_TUNNEL_TOKEN

models:
  esd-buddy:
    model: ${DASHBOARD_ASSISTANT_LOCAL_MODEL_ARTIFACT:-ai/qwen3.5:4b-q4_K_M}
    context_size: 8192
