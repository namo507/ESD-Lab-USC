services:
  dashboard:
    init: true
    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile
    ports:
      - "${DASHBOARD_HOST_PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      DASHBOARD_ASSISTANT_TIER: ${DASHBOARD_ASSISTANT_TIER:-auto}
      DASHBOARD_ASSISTANT_AUTO_DOWNLOAD: ${DASHBOARD_ASSISTANT_AUTO_DOWNLOAD:-false}
      DASHBOARD_ASSISTANT_CONTEXT_WINDOW: ${DASHBOARD_ASSISTANT_CONTEXT_WINDOW:-2048}
      DASHBOARD_ASSISTANT_THREADS: ${DASHBOARD_ASSISTANT_THREADS:-4}
      HF_HOME: /app/models/.cache/huggingface
    cpus: "2.0"
    mem_limit: ${DASHBOARD_MEM_LIMIT:-2g}
    pids_limit: 512
    volumes:
      - ../:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/healthz'))
          assert payload.get('status') == 'ok'
          assert payload.get('dashboard')
          assert payload.get('readings')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  assistant-bootstrap:
    profiles: ["assistant"]
    init: true
    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      DASHBOARD_ASSISTANT_TIER: ${DASHBOARD_ASSISTANT_TIER:-clinical}
      HF_HOME: /app/models/.cache/huggingface
    command:
      - python
      - scripts/prepare_dashboard_assistant.py
      - --tier
      - ${DASHBOARD_ASSISTANT_TIER:-clinical}
      - --write-config
      - --download
      - --reindex
    volumes:
      - ../:/app
    restart: "no"

  dashboard-share:
    profiles: ["share"]
    image: cloudflare/cloudflared:2026.5.2
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://dashboard:8080
    restart: unless-stopped

  dashboard-share-named:
    profiles: ["share"]
    image: cloudflare/cloudflared:2026.5.2
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-${CLOUDFLARED_TUNNEL_TOKEN:-}}
    restart: unless-stopped
