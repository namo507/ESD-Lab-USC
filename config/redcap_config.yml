# ============================================================
# NANO Study — REDCap Canonical Contract
# Edit this file first. Python, R, TypeScript, schemas, context docs,
# assistant grounding, and REDCap visualizations derive from this contract.
# Tokens must live only in environment variables or encrypted secrets.
# ============================================================

api:
  base_url: "${REDCAP_API_URL}"
  format: "json"
  type: "flat"
  chunk_size: 500
  timeout_seconds: 120
  verify_ssl: true

project:
  pid: 5955
  title: "Namit - NANO Study Surveys"
  is_longitudinal: true
  missing_data_codes: ["SKIP"]

events:
  order:
    - consent_arm_1
    - caregiver_1_arm_1
    - caregiver_2_arm_1
    - sibling_arm_1
    - 1_month_arm_1
    - 2_months_arm_1
    - 3_months_arm_1
    - 6_months_arm_1
    - 9_months_arm_1
    - 12_months_arm_1
    - 24_months_arm_1
    - 36_months_arm_1
  labels:
    consent_arm_1: Consent
    caregiver_1_arm_1: Caregiver 1
    caregiver_2_arm_1: Caregiver 2
    sibling_arm_1: Sibling
    1_month_arm_1: 1 Month
    2_months_arm_1: 2 Months
    3_months_arm_1: 3 Months
    6_months_arm_1: 6 Months
    9_months_arm_1: 9 Months
    12_months_arm_1: 12 Months
    24_months_arm_1: 24 Months
    36_months_arm_1: 36 Months
  visit_events:
    - 1_month_arm_1
    - 2_months_arm_1
    - 3_months_arm_1
    - 6_months_arm_1
    - 9_months_arm_1
    - 12_months_arm_1
    - 24_months_arm_1
    - 36_months_arm_1

instruments:
  visit_anchor: visit_occurred
  visit_date_field: visit_date
  carry_forward:
    instrument: csbs_caregiver
    complete_field: csbs_caregiver_complete
    events:
      - 6_months_arm_1
      - 9_months_arm_1
      - 12_months_arm_1
      - 24_months_arm_1
  auto_continue_anchor: medication_questionnaire

status_codes:
  "0": { label: Incomplete, token: status-red, normalized: incomplete }
  "1": { label: Unverified, token: status-amber, normalized: unverified }
  "2": { label: Complete, token: status-green, normalized: complete }
  "": { label: Not started, token: status-grey, normalized: not_started }
  "SKIP": { label: Skipped, token: status-blue, normalized: skipped }

anomaly_codes:
  R1: "6m CSBS incomplete and 9m visit_date set"
  R2: "9m CSBS incomplete and 12m visit_date set"
  R3: "6m CSBS blank but 9m CSBS complete"
  R4: "9m CSBS blank but 12m CSBS complete"
  R5: "12m CSBS incomplete and 24m visit_date set"

phi_fields:
  - first_name
  - last_name
  - child_dob
  - caregiver_name
  - caregiver_phone
  - street_address
  - email
  - mrn
  - record_id_original

# Legacy operational labels used by older aggregate pipeline sections.
# REDCap PID 5955 no longer uses these as canonical event names or arms.
legacy:
  groups:
    ASIB:
      n_target: 65
      color: "#C44E52"
      label: "ASIB (VPT + ASD traits)"
    PT:
      n_target: 130
      color: "#4C72B0"
      label: "PT (VPT typical)"
    TD:
      n_target: 65
      color: "#55A868"
      label: "TD (Term-born typical)"
