name: esd-lab-usc

services:
  dashboard:
    init: true
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: esd-lab-usc-dashboard:latest
    ports:
      - "${DASHBOARD_HOST_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      DASHBOARD_ASSISTANT_TIER: ${DASHBOARD_ASSISTANT_TIER:-auto}
      DASHBOARD_ASSISTANT_AUTO_DOWNLOAD: ${DASHBOARD_ASSISTANT_AUTO_DOWNLOAD:-false}
      DASHBOARD_ASSISTANT_CONTEXT_WINDOW: ${DASHBOARD_ASSISTANT_CONTEXT_WINDOW:-2048}
      DASHBOARD_ASSISTANT_THREADS: ${DASHBOARD_ASSISTANT_THREADS:-4}
      HF_HOME: /app/models/.cache/huggingface
    cpus: "2.0"
    mem_limit: ${DASHBOARD_MEM_LIMIT:-2g}
    pids_limit: 512
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: dashboard-hf-cache
        target: /app/models/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/healthz'))
          assert payload.get('status') == 'ok'
          assert payload.get('dashboard')
          assert payload.get('readings')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      autoheal: "true"
    restart: unless-stopped
    networks:
      - esd-lab-dashboard

  dashboard-share:
    profiles: ["share"]
    image: cloudflare/cloudflared:2026.5.2
    env_file:
      - path: .env
        required: false
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://dashboard:8080
    restart: unless-stopped
    networks:
      - esd-lab-dashboard

  dashboard-share-named:
    profiles: ["share"]
    image: cloudflare/cloudflared:2026.5.2
    env_file:
      - path: .env
        required: false
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-${CLOUDFLARED_TUNNEL_TOKEN:-}}
    restart: unless-stopped
    networks:
      - esd-lab-dashboard

  # Continuous self-heal: watches the Docker daemon for containers labelled
  # `autoheal=true` that report an "unhealthy" healthcheck status and restarts
  # them. Plain `restart: unless-stopped` only reacts to a process exit, not to
  # a process that is alive but failing its healthcheck — this closes that gap.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    init: true
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "60"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    cpus: "0.25"
    mem_limit: 64m
    pids_limit: 64
    networks:
      - esd-lab-dashboard

volumes:
  dashboard-hf-cache:

networks:
  esd-lab-dashboard:
    driver: bridge
