name: esd-lab-usc

x-dashboard-assistant-environment: &dashboard-assistant-environment
  DASHBOARD_ASSISTANT_PROVIDER: ${DASHBOARD_ASSISTANT_PROVIDER:-nvidia}
  DASHBOARD_ASSISTANT_RUNTIME: ${DASHBOARD_ASSISTANT_RUNTIME:-nvidia-build-api}
  DASHBOARD_ASSISTANT_API_BASE: ${DASHBOARD_ASSISTANT_API_BASE:-https://integrate.api.nvidia.com/v1}
  DASHBOARD_ASSISTANT_API_KEY: ${DASHBOARD_ASSISTANT_API_KEY:-${OPENAI_API_KEY:-}}
  DASHBOARD_ASSISTANT_MODEL: ${DASHBOARD_ASSISTANT_MODEL:-nvidia/nemotron-3-super-120b-a12b}
  DASHBOARD_ASSISTANT_MODEL_ID: ${DASHBOARD_ASSISTANT_MODEL_ID:-nvidia/nemotron-3-super-120b-a12b}
  DASHBOARD_ASSISTANT_ENABLE_THINKING: ${DASHBOARD_ASSISTANT_ENABLE_THINKING:-false}
  DASHBOARD_ASSISTANT_REASONING_BUDGET: ${DASHBOARD_ASSISTANT_REASONING_BUDGET:-0}
  DASHBOARD_ASSISTANT_MAX_NEW_TOKENS: ${DASHBOARD_ASSISTANT_MAX_NEW_TOKENS:-16384}
  DASHBOARD_ASSISTANT_TEMPERATURE: ${DASHBOARD_ASSISTANT_TEMPERATURE:-0.2}
  DASHBOARD_ASSISTANT_TOP_P: ${DASHBOARD_ASSISTANT_TOP_P:-0.95}
  DASHBOARD_ASSISTANT_STREAM: ${DASHBOARD_ASSISTANT_STREAM:-true}
  DASHBOARD_ASSISTANT_REQUEST_TIMEOUT_SECONDS: ${DASHBOARD_ASSISTANT_REQUEST_TIMEOUT_SECONDS:-180}
  DASHBOARD_ASSISTANT_MAX_RETRIES: ${DASHBOARD_ASSISTANT_MAX_RETRIES:-6}
  DASHBOARD_ASSISTANT_RETRY_BASE_SECONDS: ${DASHBOARD_ASSISTANT_RETRY_BASE_SECONDS:-2}
  DASHBOARD_ASSISTANT_RETRY_MAX_SECONDS: ${DASHBOARD_ASSISTANT_RETRY_MAX_SECONDS:-30}
  DASHBOARD_ASSISTANT_RETRY_JITTER: ${DASHBOARD_ASSISTANT_RETRY_JITTER:-0.25}
  DASHBOARD_ASSISTANT_MAX_CONCURRENCY: ${DASHBOARD_ASSISTANT_MAX_CONCURRENCY:-2}
  DASHBOARD_ASSISTANT_CIRCUIT_FAILURE_THRESHOLD: ${DASHBOARD_ASSISTANT_CIRCUIT_FAILURE_THRESHOLD:-3}
  DASHBOARD_ASSISTANT_CIRCUIT_RECOVERY_SECONDS: ${DASHBOARD_ASSISTANT_CIRCUIT_RECOVERY_SECONDS:-60}
  DASHBOARD_ASSISTANT_QUEUE_TIMEOUT_SECONDS: ${DASHBOARD_ASSISTANT_QUEUE_TIMEOUT_SECONDS:-180}
  DASHBOARD_ASSISTANT_CONTEXT_BUDGET: ${DASHBOARD_ASSISTANT_CONTEXT_BUDGET:-12000}
  DASHBOARD_ASSISTANT_SELF_HOSTED_ENABLED: ${DASHBOARD_ASSISTANT_SELF_HOSTED_ENABLED:-false}
  DASHBOARD_ASSISTANT_SELF_HOSTED_BASE_URL: ${DASHBOARD_ASSISTANT_SELF_HOSTED_BASE_URL:-http://nemotron-nim:8000/v1}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://integrate.api.nvidia.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-${DASHBOARD_ASSISTANT_API_KEY:-}}

services:
  dashboard:
    init: true
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: esd-lab-usc-dashboard:latest
    ports:
      - "${DASHBOARD_HOST_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *dashboard-assistant-environment
      PYTHONUNBUFFERED: "1"
      DASHBOARD_REUSE_EXISTING_SPA_BUILD: ${DASHBOARD_REUSE_EXISTING_SPA_BUILD:-true}
    cpus: "2.0"
    mem_limit: ${DASHBOARD_MEM_LIMIT:-2g}
    pids_limit: 512
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: dashboard-node-modules
        target: /app/web/node_modules
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request
          payload = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/healthz'))
          assert payload.get('status') == 'ok'
          assert payload.get('dashboard')
          assert payload.get('readings')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      com.esdlabusc.autoheal: "true"
    restart: unless-stopped
    networks:
      - esd-lab-dashboard

  dashboard-share:
    profiles: ["share"]
    image: cloudflare/cloudflared:2026.5.2
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2}
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    command: tunnel --metrics 0.0.0.0:2000 --no-autoupdate --url http://dashboard:8080
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      com.esdlabusc.autoheal: "true"
    restart: unless-stopped
    networks:
      - esd-lab-dashboard

  dashboard-share-named:
    profiles: ["share"]
    image: cloudflare/cloudflared:2026.5.2
    environment:
      TUNNEL_TRANSPORT_PROTOCOL: ${CLOUDFLARE_TUNNEL_PROTOCOL:-http2}
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      dashboard:
        condition: service_healthy
    command: tunnel --metrics 0.0.0.0:2000 --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-${CLOUDFLARED_TUNNEL_TOKEN:-}}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      com.esdlabusc.autoheal: "true"
    restart: unless-stopped
    networks:
      - esd-lab-dashboard

  # Continuous self-heal: watches the Docker daemon for containers labelled
  # `autoheal=true` that report an "unhealthy" healthcheck status and restarts
  # them. Plain `restart: unless-stopped` only reacts to a process exit, not to
  # a process that is alive but failing its healthcheck — this closes that gap.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    init: true
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: com.esdlabusc.autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "60"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    cpus: "0.25"
    mem_limit: 64m
    pids_limit: 64
    networks:
      - esd-lab-dashboard

volumes:
  dashboard-node-modules:

networks:
  esd-lab-dashboard:
    driver: bridge
