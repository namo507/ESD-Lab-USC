name: Deploy Pages site

on:
  push:
    branches: [main]
    paths:
      - "web/index.html"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/public/**"
      - "web/src/**"
      - "web/vite.config.ts"
      - "web/tsconfig.json"
      - "web/tailwind.config.ts"
      - "web/postcss.config.js"
      - "config/redcap_config.yml"
      - "functions/**"
      - "dashboard/assistant/local_chat_assistant.py"
      - "dashboard/context_skill/extract_context.py"
      - "dashboard/context_skill/references/dashboard_schema.md"
      - "dashboard/context_skill/references/tables/redcap.md"
      - "dashboard/data/dashboard_data.json"
      - "dashboard/pipelines/build_dashboard_data.py"
      - "dashboard/pipelines/build_dashboard_data.R"
      - "dashboard/pipelines/generate_synthetic_dashboard_data.py"
      - "dashboard/server/live_dashboard_server.py"
      - "scripts/gen_redcap_constants.mjs"
      - "scripts/build_pages_site.py"
      - "scripts/check_live_surfaces.py"
      - "scripts/check_site_health.py"
      - "dashboard/public/pages_wrapper/manifest.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'esd-lab-namo' }}
      CLOUDFLARE_PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH || 'main' }}
      # Only stable, operator-managed origins are eligible. The packager probes
      # this value and falls back locally when it is absent or unhealthy.
      PAGES_API_ORIGIN: ${{ vars.PAGES_API_ORIGIN || vars.DASHBOARD_API_ORIGIN || (vars.DASHBOARD_PUBLIC_HOSTNAME && format('https://{0}', vars.DASHBOARD_PUBLIC_HOSTNAME)) || '' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install generator Python deps
        run: python -m pip install "PyYAML>=6.0.1,<7"

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Generate REDCap TS constants
        run: |
          node scripts/gen_redcap_constants.mjs
          git diff --exit-code web/src/constants/redcapConfig.ts

      - name: Build React SPA
        working-directory: web
        env:
          VITE_FEATURE_RSA_GROWTH_CURVES: "true"
          VITE_FEATURE_HDA_TIMELINE_PLAYER: "true"
          VITE_FEATURE_THERMAL_HEATMAP: "true"
          VITE_FEATURE_SWIMMER_PLOT: "true"
          VITE_FEATURE_ATTRITION_FUNNEL: "true"
          VITE_FEATURE_SDOH_MAP: "true"
          VITE_FEATURE_SHAP_BEESWARM: "true"
          VITE_FEATURE_CLUSTER_VIEWER: "true"
          VITE_FEATURE_MODEL_LEADERBOARD: "true"
          VITE_FEATURE_CASCADE_DAG: "true"
          VITE_FEATURE_REDCAP_COMPLETENESS: "true"
          VITE_FEATURE_REDCAP_VISIT_HEALTH: "true"
          VITE_FEATURE_ECG_QUALITY_MONITOR: "true"
          VITE_FEATURE_SPATIAL_ASSESSMENT_MATRIX: "true"
          VITE_FEATURE_ATTACHMENT_HEATMAP: "true"
          VITE_FEATURE_CGA_RIVER: "true"
          VITE_FEATURE_COUNTY_COMPARATOR: "true"
          VITE_FEATURE_PARTICIPANT_TIMELINE_V2: "true"
          VITE_FEATURE_MODEL_CONFIDENCE_TERRAIN: "true"
          VITE_FEATURE_ATTRITION_FUNNEL_V2: "true"
          VITE_FEATURE_GUIDED_EXPLORER: "true"
          VITE_FEATURE_PUBLIC_INSIGHTS: "true"
          VITE_FEATURE_EXECUTIVE_MODE: "true"
          VITE_FEATURE_DYN_INFANT_PASSPORT: "true"
          VITE_FEATURE_DYN_CASCADE_SIMULATOR: "true"
          VITE_FEATURE_MULTIMODAL_SYNCHRONY: "true"
          VITE_FEATURE_DYN_CO_REGULATION_BRAID: "true"
          VITE_USE_MOCKS: "true"
          VITE_LIVE_ASSISTANT: "true"
        run: |
          npm run build
          test -s build/index.html

      - name: Package deploy artifact
        run: |
          python scripts/build_pages_site.py
          test -s dist/pages-wrapper/index.html
          test -s dist/pages-wrapper/_worker.js
          test -s dist/pages-wrapper/_redirects
          ls -lah dist/pages-wrapper/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist/pages-wrapper
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ env.CLOUDFLARE_PAGES_BRANCH }}
            --commit-dirty=true

      - name: Smoke test live URL
        run: |
          sleep 60
          python scripts/check_live_surfaces.py \
            --canonical-url https://esd-lab-namo.pages.dev/ \
            --skip-runtime \
            --timeout 30 \
            --max-stamp-age-hours 24
