name: Uptime monitor

# Monitor the durable Pages surface. Ephemeral trycloudflare origins are not an
# uptime target and this workflow intentionally does not dispatch redeploys:
# rebuilding the same stale origin caused an unbounded workflow/issue loop.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe durable public site
        id: probe
        run: |
          set +e
          : > probe.log
          python scripts/check_live_surfaces.py \
            --canonical-url "https://esd-lab-namo.pages.dev/" \
            --canonical-route / \
            --canonical-route /redcap \
            --canonical-route /pipeline-health \
            --skip-runtime \
            --timeout 25 \
            --max-stamp-age-hours 168 \
            >> probe.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat probe.log
          exit 0

      - name: Open or refresh incident issue
        if: steps.probe.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "ESD Pages site is down";
            const log = require("fs").readFileSync("probe.log", "utf-8");
            const body = [
              "The durable Cloudflare Pages dashboard failed its shell/API-contract probe.",
              "",
              "Run: " + process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID,
              "",
              "Probe output:",
              "```",
              log.trim().slice(-6000),
              "```",
              "",
              "The monitor did not trigger a redeploy. Pages deploys only use a healthy, stable configured origin; otherwise they publish the built-in fallback API.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["uptime", "incident"],
              });
            }

      - name: Close incident issue on recovery
        if: steps.probe.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "ESD Pages site is down";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "uptime",
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Durable Pages probes are healthy again — closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
