name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image_tar_sha256: ${{ steps.image_tar_sha.outputs.sha256 }}

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/esd-lab-usc-dashboard
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/esd-lab-usc-dashboard:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dashboard/Dockerfile
          pull: true
          no-cache: true
          outputs: type=docker,dest=${{ runner.temp }}/dashboard-image.tar
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PIP_VERSION=25.3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load dashboard image for scanning
        run: docker load --input "$RUNNER_TEMP/dashboard-image.tar"

      - name: Scan dashboard image for fixable high-severity CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          version: v0.70.0

      - name: Record scanned image artifact digest
        id: image_tar_sha
        shell: bash
        run: |
          digest="$(sha256sum "$RUNNER_TEMP/dashboard-image.tar" | cut -d ' ' -f 1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Preserve scanned image for main-only publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/dashboard-image.tar
          archive: false
          retention-days: 1

  publish-dashboard-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dashboard-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/esd-lab-usc-dashboard
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/esd-lab-usc-dashboard:${{ github.sha }}
      EXPECTED_IMAGE_TAR_SHA256: ${{ needs['dashboard-image'].outputs.image_tar_sha256 }}

    steps:
      - name: Download scanned dashboard image
        uses: actions/download-artifact@v8
        with:
          name: dashboard-image.tar
          path: ${{ runner.temp }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dashboard image
        shell: bash
        run: |
          image_tar="$RUNNER_TEMP/dashboard-image.tar"
          actual_digest="$(sha256sum "$image_tar" | cut -d ' ' -f 1)"
          test -n "$EXPECTED_IMAGE_TAR_SHA256"
          test "$actual_digest" = "$EXPECTED_IMAGE_TAR_SHA256"
          docker load --input "$image_tar"
          docker image inspect "$IMAGE_REF" >/dev/null
          docker push "$IMAGE_REF"
          docker push "$IMAGE_NAME:latest"
