name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}
      IMAGE_NAME: esd-lab-usc-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            PIP_VERSION=25.3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Scout CVE scan
        continue-on-error: true
        run: docker scout cves "${IMAGE_NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}"
