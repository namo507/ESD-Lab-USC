name: REDCap Portfolio Sync and Deploy

on:
  schedule:
    # A request, not a guarantee. GitHub throttles scheduled workflows under
    # load: across 30 consecutive runs this one arrived every 18-57 minutes
    # (median 28.4), never once at five. Kept at */5 because asking less often
    # can only reduce freshness -- the cadence and SLA the dashboard publishes
    # are in config/redcap_projects.yml and describe what actually lands.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: redcap-sync
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'esd-lab-namo' }}
      CLOUDFLARE_PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH || 'main' }}
      PAGES_API_ORIGIN: ${{ vars.PAGES_API_ORIGIN || vars.DASHBOARD_API_ORIGIN || (vars.DASHBOARD_PUBLIC_HOSTNAME && format('https://{0}', vars.DASHBOARD_PUBLIC_HOSTNAME)) || '' }}
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install sync and generator dependencies
        run: python -m pip install "requests>=2.31,<3" "PyYAML>=6.0.1,<7"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Synchronize all eight REDCap projects
        env:
          REDCAP_API_URL: ${{ vars.REDCAP_API_URL || 'https://redcap.research.sc.edu/api/' }}
          REDCAP_ABC_SURVEYS_TOKEN: ${{ secrets.REDCAP_ABC_SURVEYS_TOKEN }}
          REDCAP_IPSA_SURVEYS_TOKEN: ${{ secrets.REDCAP_IPSA_SURVEYS_TOKEN }}
          REDCAP_ACTION_TOKEN: ${{ secrets.REDCAP_ACTION_TOKEN }}
          REDCAP_IPSA_LAB_TOKEN: ${{ secrets.REDCAP_IPSA_LAB_TOKEN }}
          REDCAP_ABC_LAB_TOKEN: ${{ secrets.REDCAP_ABC_LAB_TOKEN }}
          REDCAP_NICO_TOKEN: ${{ secrets.REDCAP_NICO_TOKEN }}
          REDCAP_NANO_SURVEYS_TOKEN: ${{ secrets.REDCAP_NANO_SURVEYS_TOKEN }}
          REDCAP_NANO_LAB_TOKEN: ${{ secrets.REDCAP_NANO_LAB_TOKEN }}
        run: |
          umask 077
          python scripts/sync_redcap_portfolio.py --require-all
          test -s dashboard/data/dashboard_metrics.json
          python scripts/sync_redcap_dictionary.py
          test -s dashboard/data/redcap_dictionary.json
          python scripts/build_redcap_portfolio_data.py
          test -s dashboard/data/redcap_portfolio.json

      - name: Generate REDCap TypeScript constants
        run: |
          node scripts/gen_redcap_constants.mjs
          git diff --exit-code web/src/constants/redcapConfig.ts

      - name: Build production React SPA without mocks
        working-directory: web
        env:
          VITE_FEATURE_RSA_GROWTH_CURVES: "true"
          VITE_FEATURE_HDA_TIMELINE_PLAYER: "true"
          VITE_FEATURE_THERMAL_HEATMAP: "true"
          VITE_FEATURE_SWIMMER_PLOT: "true"
          VITE_FEATURE_ATTRITION_FUNNEL: "true"
          VITE_FEATURE_SDOH_MAP: "true"
          VITE_FEATURE_SHAP_BEESWARM: "true"
          VITE_FEATURE_CLUSTER_VIEWER: "true"
          VITE_FEATURE_MODEL_LEADERBOARD: "true"
          VITE_FEATURE_CASCADE_DAG: "true"
          VITE_FEATURE_REDCAP_COMPLETENESS: "false"
          VITE_FEATURE_REDCAP_VISIT_HEALTH: "false"
          VITE_FEATURE_ECG_QUALITY_MONITOR: "true"
          VITE_FEATURE_SPATIAL_ASSESSMENT_MATRIX: "true"
          VITE_FEATURE_ATTACHMENT_HEATMAP: "true"
          VITE_FEATURE_CGA_RIVER: "true"
          VITE_FEATURE_COUNTY_COMPARATOR: "true"
          VITE_FEATURE_PARTICIPANT_TIMELINE_V2: "true"
          VITE_FEATURE_MODEL_CONFIDENCE_TERRAIN: "true"
          VITE_FEATURE_ATTRITION_FUNNEL_V2: "true"
          VITE_FEATURE_GUIDED_EXPLORER: "true"
          VITE_FEATURE_PUBLIC_INSIGHTS: "true"
          VITE_FEATURE_EXECUTIVE_MODE: "true"
          VITE_FEATURE_DYN_INFANT_PASSPORT: "true"
          VITE_FEATURE_DYN_CASCADE_SIMULATOR: "true"
          VITE_FEATURE_MULTIMODAL_SYNCHRONY: "true"
          VITE_FEATURE_DYN_CO_REGULATION_BRAID: "true"
          VITE_USE_MOCKS: "false"
          VITE_LIVE_ASSISTANT: "true"
        run: |
          npm run build
          test -s build/index.html

      - name: Package privacy-validated Pages artifact
        run: |
          python scripts/build_pages_site.py --require-live-metrics
          test -s dist/pages-wrapper/index.html
          test -s dist/pages-wrapper/_worker.js
          test -s dist/pages-wrapper/dashboard/data/dashboard_metrics.json
          test ! -e dist/pages-wrapper/dashboard/data/dashboard_data.json

      - name: Deploy aggregate metrics to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist/pages-wrapper
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ env.CLOUDFLARE_PAGES_BRANCH }}
            --commit-dirty=true

      - name: Verify live aggregate health and retired proxy
        run: |
          sleep 60
          canonical_url="https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev/"
          # The --max-metrics-age-minutes bound below is deliberately tighter
          # than the published freshness SLA in config/redcap_projects.yml.
          # This is a deploy-freshness check: the sync step regenerated this
          # artifact minutes ago in this same job, so anything approaching the
          # SLA here means the sync silently shipped stale data. It is not a
          # claim about how often the dashboard refreshes.
          python scripts/check_live_surfaces.py \
            --canonical-url "$canonical_url" \
            --skip-runtime \
            --require-live-metrics \
            --max-metrics-age-minutes 15 \
            --timeout 30 \
            --max-stamp-age-hours 24
