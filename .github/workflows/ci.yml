name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate repository workflow policy
        run: |
          python -m pip install "PyYAML>=6.0.1,<7"
          python scripts/check_github_workflows.py

      - name: Enforce repository footprint policy
        run: python scripts/check_repository_hygiene.py

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Despite the old name, no test needs R: nothing under tests/ references
      # rpy2, robjects or Rscript. R is here for the step below it --
      # requirements.txt pins rpy2, whose install wants an R toolchain present.
      # The timeout is deliberate. This step runs apt-get update, and a stalled
      # Ubuntu mirror hangs it silently: on 2026-08-19 it sat 19 minutes inside
      # a single `Get: archive.ubuntu.com noble-security InRelease` with no
      # output, consumed the whole 20-minute job budget, and surfaced as
      # `cancelled` -- which reads as "a human cancelled this", not "CI broke".
      # Six minutes is roughly 3x this step's normal cost.
      - name: Install R (toolchain for the rpy2 dependency)
        timeout-minutes: 6
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Validate Compose config
        run: python scripts/check_compose_config.py

      - name: Check formatting (black)
        run: black --check src/ tests/ scripts/ redcap/

      - name: Check import ordering (isort)
        run: isort --check-only src/ tests/ scripts/ redcap/

      - name: Run flake8
        run: |
          flake8 src/ tests/ scripts/ redcap/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E402,F401,F841,F541,W391 \
            --per-file-ignores=scripts/build_pages_site.py:E501,scripts/check_dashboard_runtime.py:E501

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # These four gates all existed and none of them ran anywhere in CI, so a
      # lint error or a failing component test could reach main unnoticed --
      # which is exactly how one did. The deploy runs `npm run build` (tsc plus
      # vite) but never eslint or vitest, and by then it is already shipping.
      - name: Lint
        working-directory: web
        run: npm run lint

      # Build before test, and no separate typecheck step: `npm run build` is
      # `tsc --noEmit && vite build`, so a standalone typecheck would run tsc
      # twice. Running build first still fails fast on a type error, without
      # paying for the ~60s test run to find it.
      - name: Build (typechecks, then bundles)
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm run test

  test-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Built with mocks on. The probe needs pages with real content: the
      # dashboard/data/*.json artefacts come from live REDCap and are not in
      # CI, so without mocks most routes render an error state -- and an
      # errored page has no text, therefore no contrast failures, therefore
      # looks exactly like a pass. The probe's render guard fails the run if
      # any route comes back too thin to measure, so this cannot silently rot.
      - name: Build with in-browser mocks
        working-directory: web
        env:
          VITE_USE_MOCKS: "true"
        run: npm run build

      - name: Serve the build
        working-directory: web
        run: |
          npx --yes serve -s build -l 4173 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/

      - name: Contrast probe
        working-directory: web
        run: npm run test:contrast

  test-dashboard-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Prepare writable bind-mount paths
        run: |
          mkdir -p logs web/build dashboard/data data/processed models
          chmod -R a+rwX logs web dashboard/data data models

      - name: Build dashboard image
        run: docker compose -f docker/compose.dev.yml build dashboard

      - name: Start dashboard runtime
        run: docker compose -f docker/compose.dev.yml up -d dashboard

      - name: Self-heal Docker runtime if needed
        run: |
          python3 scripts/check_docker_health.py \
            --service dashboard \
            --check-url http://127.0.0.1:8080/api/healthz \
            --repair \
            --wait-seconds 120 \
            --json

      - name: Smoke test dashboard runtime
        run: python3 scripts/check_dashboard_runtime.py --base-url http://127.0.0.1:8080 --timeout 180

      - name: Dashboard logs
        if: always()
        run: docker compose -f docker/compose.dev.yml logs --tail=200 dashboard

      - name: Tear down services
        if: always()
        run: docker compose -f docker/compose.dev.yml down --remove-orphans --volumes
