name: Kubernetes validation

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "k8s/pipeline/**"
      - "k8s/**"
      - ".github/workflows/k8s-validate.yml"
  workflow_dispatch:

jobs:
  helm-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint k8s/helm/esd-lab-dashboard \
            --set existingClaims.readings=esd-readings-rwx \
            --set existingClaims.data=esd-dashboard-data-rwx

      - name: Render manifests
        run: |
          helm template esd-lab-dashboard k8s/helm/esd-lab-dashboard \
            --namespace esd-lab \
            --set existingClaims.readings=esd-readings-rwx \
            --set existingClaims.data=esd-dashboard-data-rwx \
            > /tmp/esd-lab-dashboard.yaml
          test -s /tmp/esd-lab-dashboard.yaml

      - name: Schema validate rendered manifests
        run: |
          docker run --rm \
            -v /tmp:/tmp:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -ignore-missing-schemas \
            /tmp/esd-lab-dashboard.yaml
