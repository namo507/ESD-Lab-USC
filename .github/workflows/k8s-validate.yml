name: Kubernetes validation

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "dashboard/k8s_pipeline/**"
      - "k8s/**"
      - ".github/workflows/k8s-validate.yml"
  workflow_dispatch:

jobs:
  helm-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Lint chart
        run: helm lint k8s/helm/esd-lab-dashboard

      - name: Render manifests
        run: |
          helm template esd-lab-dashboard k8s/helm/esd-lab-dashboard \
            --namespace esd-lab \
            --set existingClaims.readings=esd-readings-rwx \
            --set existingClaims.data=esd-dashboard-data-rwx \
            > /tmp/esd-lab-dashboard.yaml
          test -s /tmp/esd-lab-dashboard.yaml

      - name: Client dry-run parse
        run: kubectl apply --dry-run=client --validate=false -f /tmp/esd-lab-dashboard.yaml
